format_version = 1
id = "megaman-x.character.ksx-zero"
version = "0.0.2"
name = "KSX Zero settings"
author = "KamiSquad_X; with RaphaelAzev as the base"
description = "KSX Zero settings for the Add Zero or Co-op Zero behavior: Saber Zero by RaphaelAzev as the base, plus Special Moves and a Giga Attack learned from the Mavericks. Saber sprites and sounds from the Zashiko Mod; Special Move art from the Mega Man X Engine (Dragon-Developer and team) and X8 16-bit by Alysson da Paz. For non-commercial use."
license = "PolyForm-Noncommercial-1.0.0"
resolver = "declarative"
save_compatibility = "requires-same-mods"

[[target]]
game_id = "megaman-x-us"
rom_sha256 = "b8f70a6e7fb93819f79693578887e2c11e196bdf1ac6ddc7cb924b1ad0be2d32"

[[feature]]
id = "ksx-zero"
name = "KSX Zero settings"
description = "Applies when Zero behavior is KSX Zero in Add Zero or Co-op. Includes X1 armor upgrades and Black Zero; without these settings, KSX Zero uses the defaults shown here."
group = "Characters"
order = 1
default_enabled = false

[[option]]
feature = "ksx-zero"
id = "show_hitboxes"
label = "Show hitboxes"
description = "Debug: outline enemy, Zero and saber attack hitboxes (custom renderer only)"
type = "boolean"
default = false

[[option]]
feature = "ksx-zero"
id = "armor_view"
label = "Values shown"
description = "Which damage values the list shows and edits: Unarmored Zero's (with only the arm parts, these get +2, or +1 against bosses) or Black Zero's (all four armor parts), which replace them while Black Zero is worn. Only changes what this page shows."
type = "choice"
default = "unarmored"
inline_after = "show_hitboxes"
[[option.choice]]
value = "unarmored"
label = "Unarmored Zero"
[[option.choice]]
value = "black"
label = "Black Zero"

[[option]]
feature = "ksx-zero"
id = "start_all_upgrades"
label = "Start with all upgrades"
description = "Gives all four armor parts at stage start; meant for testing and stored in the password like collected parts."
type = "boolean"
default = false

[[option]]
feature = "ksx-zero"
id = "stagger_combos"
label = "Stagger Combos"
description = "While a Maverick is staggered by any player's hit, each different KSX Zero move that lands restaggers it. Repeating a move in the same combo meets the Maverick's invincibility instead and deals no damage."
type = "boolean"
default = true
[[option]]
feature = "ksx-zero"
id = "rakuhouha_energy"
label = "Rakuhouha energy"
description = "Weapon energy (of 28) each Rakuhouha spends."
type = "integer"
default = 4
min = 0
max = 28
step = 1
