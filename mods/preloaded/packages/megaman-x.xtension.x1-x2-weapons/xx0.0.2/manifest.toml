[[feature]]
id = "weapons"
name = "X1 to X2 boss weapons"
description = "Needs the X2 game extension. In X2's pause screen, for X and Zero, L (PREV WEAPON) / R (NEXT WEAPON) turn between X2's weapons and an X1 weapons page in X2's layout (blank for X for now; KSX Zero's lists his X1 skills, in X1's order, as their Mavericks are beaten in X1). With X2 boss weapons on, X1's X2 weapons page shows each X2 weapon, and L / R in a stage switch to it, only after its boss is beaten on the X2 page."
group = "X-tensions"
order = 2
default_enabled = false

[[plugin]]
feature = "weapons"
id = "megaman-x.xtension.x1-x2-weapons"
