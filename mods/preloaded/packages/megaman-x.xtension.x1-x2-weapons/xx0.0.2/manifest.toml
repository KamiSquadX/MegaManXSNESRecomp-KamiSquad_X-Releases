name = "X1 to X2 boss weapons"
author = "KamiSquad_X"
description = "Boss weapons across the X1 and X2 pages of the X2 game extension: an X1 weapons page in X2's pause screen, and X2 weapons in X1 earned by beating their bosses in X2."
