schema = 1
identity_file = "rom_identity.txt"
cfg_roots = true
bind_legacy_profiles = true
historical_profiles = ["tier2_coverage.json"]
# Linked beside Mega Man X as a content variant: every generated symbol is
# x2_<name>, and the runtime selects this tree by id.
module_id = "x2"
module_prefix = "x2"

[[prepare]]
script = "tools/diz_annotations.py"
args = ["--game", "x2", "--rom", "{rom}"]

[[postprocess]]
script = "tools/apply_overrides.py"
args = ["--gen-dir", "{out_dir}"]

[[postprocess]]
script = "tools/diz_annotations.py"
args = ["--game", "x2", "--rom", "{rom}", "--annotate-generated", "{out_dir}"]
